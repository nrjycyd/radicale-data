name: Build Radicale Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # 每天北京时间凌晨3点执行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 0.1 检查 vCards 是否在 24h 内发布新版本
      - name: Check if new release within 24h
        id: check_release
        run: |
          RELEASE_API="https://api.github.com/repos/metowolf/vCards/releases/latest"

          echo "🔍 获取最新 release 信息..."
          RELEASE_INFO=$(curl -s "$RELEASE_API")

          LATEST_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
          PUBLISHED_AT=$(echo "$RELEASE_INFO" | jq -r '.published_at')

          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "❌ 未找到 release 信息，退出 workflow"
            exit 78
          fi

          RELEASE_TS=$(date -d "$PUBLISHED_AT" +%s)
          NOW_TS=$(date -u +%s)
          DIFF=$((NOW_TS - RELEASE_TS))

          if [ "$DIFF" -le 86400 ]; then
            echo "✅ 在24小时内发布"
          else
            echo "⏹ 超过24小时，无需构建，退出 workflow"
            exit 78
          fi

      # 1. 获取仓库
      - name: Checkout repo
        uses: actions/checkout@v5

      # 2. 克隆 vCards 仓库
      - name: Clone vCards
        run: git clone https://github.com/metowolf/vCards.git

      # 3. 按上游 package.json 安装对应版本的 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: vCards/package.json

      # 4. 安装依赖
      - name: Install dependencies
        run: |
          cd vCards
          bun install --frozen-lockfile

      # 5. 数据验证（避免脏数据进入 Release）
      - name: Run tests
        run: |
          cd vCards
          bun run test

      # 6. 构建 Radicale 数据
      - name: Build radicale data
        run: |
          cd vCards
          bun run radicale

      # 7. 压缩为 radicale-data.zip
      - name: Zip radicale data
        run: |
          cd vCards
          export LC_ALL=C.UTF-8
          zip -r ../radicale-data.zip radicale

      # 8. 压缩为 radicale-data.tar.gz
      - name: Tar radicale data
        run: |
          cd vCards
          tar --posix --owner=0 --group=0 --numeric-owner \
            -czf ../radicale-data.tar.gz radicale

      # 9. 获取当前日期
      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      # 10. 上传到 GitHub Release（两个产物一起上传）
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: radicale-${{ steps.date.outputs.date }}
          name: Released on ${{ steps.date.outputs.date }}
          body: 自动备份 Radicale 数据（包含 .zip 与 .tar.gz）
          files: |
            radicale-data.zip
            radicale-data.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 11. 删除旧的 Release（只保留最近 7 个）
      - name: Delete old Releases (保留最近 7 个)
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            const oldReleases = releases
              .filter(release => !release.draft)
              .sort((a, b) => Date.parse(b.published_at) - Date.parse(a.published_at))
              .slice(7);

            for (const release of oldReleases) {
              core.info(`删除旧 Release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner, repo, release_id: release.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info(`标签已不存在: ${release.tag_name}`);
              }
            }
